name: 🐛 Bug 反馈
description: Skill 触发异常、输出格式错误、模式路由错误等
title: "[Bug] "
labels: ["bug", "skill"]
body:
  - type: checkboxes
    id: mode
    attributes:
      label: 涉及哪个模式？
      options:
        - label: Mode 1 — 学习笔记生成
        - label: Mode 2 — 复习召回
        - label: Mode 3 — 进度检查
        - label: Mode 4 — 面试准备
        - label: Mode 5 — 提示词优化
        - label: Mode 6 — 收件箱整理
        - label: Mode 7 — 知识关联
        - label: Mode 8 — 周总结
        - label: Mode 9 — 健康诊断
        - label: 其他 / 不确定
  - type: input
    id: tool
    attributes:
      label: 使用的 AI 工具
      description: WorkBuddy / Claude Code / Trae / Codex / OpenClaw / 其他
      placeholder: "例如：WorkBuddy"
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: 你输入了什么？
      description: 你对 AI 说的话
      placeholder: "例如：总结今天学的"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望 Skill 做什么
      placeholder: "例如：应该生成学习笔记并保存到 learning-notes/"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: Skill 实际做了什么（可以贴截图或输出）
      placeholder: "例如：没有触发 Skill，AI 直接回复了通用内容"
    validations:
      required: true
  - type: checkboxes
    id: depth
    attributes:
      label: 执行深度
      options:
        - label: light（轻量模式）
        - label: standard（标准模式）
        - label: deep（深度模式）
        - label: 不确定 / 未指定
  - type: textarea
    id: config
    attributes:
      label: config.yaml 配置（如果有改动）
      description: 如果修改了默认配置，贴出来方便排查
      placeholder: "贴 config.yaml 的修改部分"
    validations:
      required: false
